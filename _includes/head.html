<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="David Valdman">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="{{ site.github.url }}/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.github.url }}/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.github.url }}/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.github.url }}/assets/favicon/apple-touch-icon.png">

  <!-- RSS Feed -->
  {% feed_meta %}

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:title" content="{{ page.title }}" />
  {% if page.excerpt %}
  <meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 200 }}" />
  {% else %}
  <meta property="og:description" content="{{ site.description }}" />
  {% endif %}
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:locale" content="en_US" />
  {% if page.image %}
  <meta property="og:image" content="{{ site.url }}/assets/img/{{ page.image }}" />
  <meta property="og:image:alt" content="{{ page.title }}" />
  {% endif %}
  {% if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <meta property="article:author" content="{{ site.author }}" />
  {% endif %}

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}" />
  <meta name="twitter:site" content="@{{ site.twitter_username }}" />
  {% if page.image %}
  <meta name="twitter:image" content="{{ site.url }}/assets/img/{{ page.image }}" />
  <meta name="twitter:image:alt" content="{{ page.title }}" />
  {% endif %}

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/syntax.css">

  <!-- MathJax -->
  <script type="text/javascript" defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    });
  </script>

  <!-- Google Analytics -->
  {% include google-analytics.html %}
  {% include rybbit-analytics.html %}
</head>
