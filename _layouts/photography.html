---
layout: default
---

<h1 class="section-header">Albums</h1>
<hr class="section-divider">

<div class="photo-albums">
{% for album in page.albums %}
<div class="album-item">
  <div class="album-title">{{ album.title }}</div>
  <a href="{{ album.link }}">
    <img src="{{ album.image }}" alt="{{ album.title }}">
  </a>
</div>
{% endfor %}
</div>
