# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# Collections
collections:
  writing:
    output: true
    permalink: /:title/
  projects:
    output: true
    permalink: /:name/
  drafts:
    output: true
    permalink: /drafts/:name/
  photography:
    output: false

# Build settings
markdown:            kramdown
highlighter:         rouge
plugins:             [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           'Writings'
description:	       ''
author:              'David Valdman'
twitter_username:    'dmvaldman'

# Configure jekyll-feed to use writing collection
feed:
  collections:
    - writing

defaults:
  - scope:
      path: ""
      type: "writing"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "drafts"
    values:
      layout: "draft"